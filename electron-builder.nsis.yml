appId: com.markz.editor
productName: Markz
artifactName: ${productName}-${version}-${os}-${arch}.${ext}
directories:
  output: release
  buildResources: build
files:
  - out/**
  - package.json
  - build/icon.png
  - build/icon.ico
asar: true
compression: maximum
electronDist: node_modules/.pnpm/electron@37.10.3/node_modules/electron/dist
win:
  signAndEditExecutable: false
  icon: build/icon.ico
  executableName: Markz
  target:
    - target: nsis
      arch: [x64]
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Markz
